[project]
name = "acquirium-backend"
version = "0.1.0"
description = "FastAPI backend for Acquirium GUI"
readme = "README.md"
# Capped below 3.14: acquirium's onnxruntime dependency has no 3.14 wheels on macOS
requires-python = ">=3.12,<3.14"

authors = [
    { name = "Lucas Hoke", email = "lhoke@mines.edu" },
    { name = "Ari Derritt", email = "arijaye_derritt@mines.edu" },
    { name = "Liam O'Byrne", email = "liam_obyrne@mines.edu" },
    { name = "Victoria Potts", email = "vpotts@mines.edu" }
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "License :: MIT License",
]

# Track your primary open-source dependencies directly inside the TOML
dependencies = [
    # Pinned pre-release: 0.3.1 (latest stable) lacks the init()/shutdown() runtime server.py uses
    "acquirium==0.4.0a8",
    "fastapi>=0.141.1",
    "uvicorn>=0.38.0",
    "pydantic>=2.11",
]

[project.optional-dependencies]
# Dependencies specifically for open-source contributors/testing
dev = [
    # FastAPI's TestClient is built on httpx2 (plain httpx is deprecated there)
    "httpx2>=2.13.1",
    "pytest>=9.1.1"
]

[tool.pytest.ini_options]
markers = [
    "fast: Quick unit tests that run instantly.",
    "slow: Integration or heavy tests that take time.",
    "watertap: Tests of the helpers that set up the WaterTAP testing environment (config template, checkout lookup).",
    "configneeded: Tests that are skipped if a server is without data, thus a config is needed for a non-trivial server with data/drivers."
]
